# Template configuration file for simulation.py
# Copy this file, rename it (the filename, without extension, becomes the
# basename used for all output files), and edit the values below.
# The values are the settings of the test runs (see CLAUDE.md, Simulation
# settings): template substrates, LTE 0/50/100 Hz and STE waveforms.

[substrate]
# Name of the substrate mesh. Expects the files:
#   substrate/<name>/<name>_vertices.csv
#   substrate/<name>/<name>_faces.csv
# This is the periodic tile made by src/substrate/spheres.py from
# substrate_configs/spheres_template.toml; cylinders_template.toml gives
# "cylinders_1198_gamma_shape4_scale0p12_gap0p1_periodic".
name = "spheres_479_gamma_shape5p76_scale1p04_gap1_periodic"

# Whether the substrate mesh is treated as periodic. true only for substrates
# built with periodic = true (their names end in "_periodic"); false for the
# others (the voxel boundaries are then impermeable walls).
periodic = true

# Initial walker position. Passed directly to disimpy's substrates.mesh(init_pos=...):
# "uniform" (everywhere), "intra" or "extra" (inside or outside the objects;
# sampled from the substrate's objects file, see README "Initial positions")
position = "uniform"

[simulation]
# Number of random walkers for the main signal simulation. The Monte Carlo
# noise scales as 1/sqrt(n_walkers) (see CLAUDE.md for the seed test).
n_walkers = 100000

# Number of simulation timesteps. The time step is the waveform duration / n_t,
# and the step length sqrt(6 D dt). n_t = 10000 for the 58.16 ms waveforms
# (5.8 us, 0.19 um at D = 1 um^2/ms), chosen from the n_t convergence test.
# For longer waveforms scale n_t with the duration to keep the same time step
# (e.g. 24000 for the 139.2 ms TDE waveforms, see config_template_tde.toml).
n_t = 10000

# Diffusivity, in m^2/s (1e-9 = 1 um^2/ms, ex vivo)
diffusivity = 1e-9

# Optional: fix the Monte Carlo seed for reproducibility.
# If omitted, a random seed is generated each run (and recorded in the
# output metadata JSON either way).
seed = 123

[waveform]
# One or more gradient waveform files (x,y,z CSV, MATLAB format), relative to waveforms/
# Each file must be an N x 3 CSV (x,y,z columns). All files must have the same
# duration (number of rows): they are simulated with one time step, and a config
# that mixes durations stops with an error.
waveform_file = [
    "LTE0hz.csv",
    "LTE50hz.csv",
    "LTE100hz.csv",
    "STEiso.csv",
    "STEaniso.csv",
]

# Rotation matrix file(s), relative to rotations/.
# Either a single filename, applied to every waveform above, e.g.
# rotation_file = "fibRot40.txt"
# ...or a list with exactly one file per waveform listed in waveform_file,
# applied in the same order:
rotation_file = [
    "fibRot40.txt",
    "fibRot40.txt",
    "fibRot40.txt",
    "ESRD2_0040.txt",
    "ESRD2_0040.txt",
]

# Target b-values (s/mm^2) to scale each waveform to. Must be non-negative;
# a value of 0 is written directly with signal = 1.0 (no simulation needed).
b_targets = [0, 500, 1000, 1500, 2000, 2500, 3000, 3500, 4000, 4500]

# Optional: sampling time step (ms) that the waveform CSV files were
# generated at (e.g. each row = 0.02 ms of the pulse sequence).
# Defaults to 0.02 ms (20 us) if omitted.
# raster_time_ms = 0.02

# Optional: unit conversion factor applied to raw waveform values to get
# them into the T/m units disimpy expects.
# Defaults to 1e-3 (waveform files assumed to be in mT/m) if omitted.
# gradient_scale = 1e-3

[trajectory]
# Optional block. If omitted entirely, trajectory output is disabled.
# Set enabled = true to additionally run a small trajectory simulation
# and write outputs/<config>/<config>_traj.csv
enabled = false

# Number of walkers to track in the trajectory simulation (only used if enabled = true)
n_walkers = 10
