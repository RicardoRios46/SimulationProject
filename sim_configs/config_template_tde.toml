# Template configuration file for simulation.py with the TDE (triple
# diffusion encoding) waveforms. See config_template.toml for all the options.
# Copy this file, rename it (the filename, without extension, becomes the
# basename used for all output files), and edit the values below.
# The values are the settings of the test runs (see CLAUDE.md, Simulation
# settings), with n_t scaled for the longer TDE waveforms.

[substrate]
# Name of the substrate mesh (substrate/<name>/<name>_vertices.csv, _faces.csv),
# here the periodic tile made from substrate_configs/spheres_template.toml
name = "spheres_479_gamma_shape5p76_scale1p04_gap1_periodic"
periodic = true
position = "uniform"

[simulation]
n_walkers = 100000

# The TDE waveforms last 139.2 ms (6960 rows), 2.4 times the 58.16 ms of the
# LTE/STE waveforms. n_t is scaled to keep the same time step as n_t = 10000
# for the 58.16 ms waveforms (5.8 us, step length 0.19 um at D = 1 um^2/ms):
# 139.2 ms / 5.8 us = ~24000.
n_t = 24000

# Diffusivity, in m^2/s (1e-9 = 1 um^2/ms, ex vivo)
diffusivity = 1e-9

# Optional: fix the Monte Carlo seed for reproducibility (random if omitted,
# recorded in the metadata either way).
seed = 123

[waveform]
# TDE waveforms only: all waveforms in a config must have the same duration,
# so the 58.16 ms LTE/STE waveforms go in their own configs.
waveform_file = ["TDE0hz.csv", "TDE50hz.csv", "TDE100hz.csv"]

# Rotation matrix file(s), relative to rotations/ (one file for all waveforms,
# or one per waveform); the same rotations as the STE waveforms
rotation_file = "ESRD2_0040.txt"

# Target b-values (s/mm^2), 0-4500 in steps of 500 as in the test runs
b_targets = [0, 500, 1000, 1500, 2000, 2500, 3000, 3500, 4000, 4500]

[trajectory]
enabled = false
n_walkers = 10
