[workspace]
name = "mc_simulations"
version = "0.1.0"
description = "Environments for substrate generation (trimesh, Python 3.13), MC simulations (disimpy, Python 3.9) and analysis (dipy, Python 3.13)"
authors = []
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

# Shared dependencies
[dependencies]
numpy = "*"
pandas = "*"

# Feature 1: DIPY stack on Python 3.13
[feature.dipy.dependencies]
python = "3.13.*"
dipy = "*"
matplotlib = "*"

# Feature 2: Disimpy stack on Python 3.9
[feature.disimpy.dependencies]
python = "3.9.*"
tomli = ">=2.2.1,<3"
cudatoolkit = "11.8.*"
numpy = "<2.0.0"

[feature.disimpy.pypi-dependencies]
disimpy = ">=0.3.0,<0.4"

# Feature 3: Trimesh
[feature.trimesh.dependencies]
python = "3.13.*"
trimesh = "*"
matplotlib = "*"
# Needed by trimesh for mesh.split() (counting separate volumes)
scipy = "*"

[feature.trimesh.pypi-dependencies]
# Needed for trimesh.boolean.union(..., engine="manifold") in the substrate scripts
manifold3d = ">=3.5.1,<4"

# task
[feature.dipy.tasks]
fitsGraph = { cmd = "python src/fit_powder_average.py {{ file }} && python src/fit_tensor.py {{ file }}", args = ["file"] }

# Environment mapping
[environments]
default = ["dipy"]
dipy-env = ["dipy"]
disimpy-env = ["disimpy"]
trimesh-env = ["trimesh"]

[tasks]
