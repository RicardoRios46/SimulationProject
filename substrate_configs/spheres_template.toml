# Template configuration file for src/substrate/spheres.py
# Copy this file, rename it, edit the values, then run from the project root:
#   pixi run -e trimesh-env python src/substrate/spheres.py substrate_configs/<config>.toml
#
# Randomly packed, non-overlapping spheres in a cube.
# All lengths are in micrometers (µm).

# Optional: substrate name, used for the output folder substrate/<name>/.
# If omitted, it is built from the parameters and the number of spheres
# actually placed, e.g. spheres_500_gamma_shape2_scale1p5_gap1
# name = "my_spheres"

# Optional: random seed. If omitted, a random seed is generated.
# The seed is always recorded in <name>_params.json.
seed = 123

# --- Geometry ---
n_objects = 500           # Number of spheres to place
domain_size = 100         # Side of the cube the sphere centers are placed in
min_gap = 1.0             # Minimum gap between sphere surfaces

# --- Radius distribution: "gamma" or "fixed" ---
radius_distribution = "gamma"

# Used when radius_distribution = "gamma". Radii outside
# [radius_min, radius_max] are redrawn (truncated gamma).
gamma_shape = 2
gamma_scale = 1.5
radius_min = 1
radius_max = 12

# Used when radius_distribution = "fixed": every sphere has this radius.
# radius_fixed = 5

# Optional: build a periodic tile (default false). Overlaps are checked across
# the faces of the cube, spheres crossing a face are wrapped to the opposite
# side, and the mesh is cut at the faces, so the substrate repeats seamlessly
# for simulations with periodic = true. The name gets "_periodic".
# periodic = true

# --- Placement (optional, defaults shown) ---
# Random positions tried per sphere before it is skipped
# max_attempts = 2000
# Stop placing after this many spheres in a row could not be placed
# max_consecutive_failures = 100
