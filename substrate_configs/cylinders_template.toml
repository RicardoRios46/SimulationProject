# Template configuration file for src/substrate/cylinders.py
# Copy this file, rename it, edit the values, then run from the project root:
#   pixi run -e trimesh-env python src/substrate/cylinders.py substrate_configs/<config>.toml
#
# Randomly packed, non-overlapping parallel cylinders along z.
# All lengths are in micrometers (µm).

# Optional: substrate name, used for the output folder substrate/<name>/.
# If omitted, it is built from the parameters and the number of cylinders
# actually placed, e.g. cylinders_1198_gamma_shape4_scale0p12_gap0p1_periodic
# name = "my_cylinders"

# Optional: random seed. If omitted, a random seed is generated.
# The seed is always recorded in <name>_params.json.
seed = 123

# --- Geometry ---
n_objects = 1200          # Number of cylinders to place (~0.30 area fraction)
domain_size = 60          # Side of the square (xy) the cylinder axes are placed in (the periodic tile)
min_gap = 0.1             # Minimum gap between cylinder surfaces
# cylinder_length = 1000  # Length along z (only with periodic = false)

# Optional: build a periodic tile (default false). Overlaps are checked across
# the faces of the square, cylinders crossing a face are wrapped to the
# opposite side, and the cylinders are open tubes cut at the z faces, so the
# tile is domain_size in x, y and z and repeats seamlessly for simulations with
# periodic = true. Remove cylinder_length when using it. The name gets "_periodic".
periodic = true

# --- Radius distribution: "gamma" or "fixed" ---
radius_distribution = "gamma"

# Used when radius_distribution = "gamma". Radii outside
# [radius_min, radius_max] are redrawn (truncated gamma).
# Axon (inner) radii of mouse corpus callosum, as validated in CATERPillar
# (gamma alpha 4, beta 0.12 against Lee et al. 2019 3D EM; mean ~0.49 µm,
# diameter ~1 µm; min radius as CATERPillar MinRadius; see CLAUDE.md)
gamma_shape = 4
gamma_scale = 0.12
radius_min = 0.15
radius_max = 1.5

# Used when radius_distribution = "fixed": every cylinder has this radius.
# radius_fixed = 0.5

# --- Placement (optional, defaults shown) ---
# Random positions tried per cylinder before it is skipped
# max_attempts = 2000
# Stop placing after this many cylinders in a row could not be placed
# max_consecutive_failures = 100
# Order of placement: "drawn" (order the radii were drawn) or "largest_first".
# In the order drawn, placement stalls near the random packing limit (~0.3-0.35
# for spheres) and then skips mostly large cylinders, biasing the radii; largest
# first reaches denser packings (0.40 for spheres) with every cylinder placed.
# placement_order = "drawn"
