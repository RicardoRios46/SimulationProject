# Template configuration file for src/substrate/caterpillar.py
# Copy this file, rename it, edit the values, then run from the project root:
#   pixi run -e trimesh-env python src/substrate/caterpillar.py substrate_configs/<config>.toml
#
# Converts a CATERPillar output file (one sphere per row) into a substrate.
# The spheres of each cell are merged into one surface, so every cell stays
# a separate compartment. All lengths are in micrometers (µm).

# CATERPillar output file, relative to the project root
input_file = "CATERPillar_inputs/single_axon_run3.csv"

# Optional: substrate name, used for the output folder substrate/<name>/.
# Defaults to caterpillar_<input file name>, e.g. caterpillar_single_axon_run3
# name = "my_caterpillar_substrate"

# Optional: radius column used for the spheres (default "inner_radius").
#   "inner_radius": the axon itself (intra-axonal space)
#   "outer_radius": including the myelin sheath
# radius_column = "inner_radius"

# Optional: only use these cell types (the cell_type column), e.g. ["axon"].
# If omitted, all rows are used.
# cell_types = ["axon"]

# Optional: resolution of each sphere (icosphere subdivisions, default 1).
# Each level multiplies the number of faces by 4: 1 -> 80 faces, 2 -> 320.
# sphere_subdivisions = 1

# Optional: Laplacian smoothing iterations after merging (default 1, 0 = off).
# Smooths the bumps between the spheres. The total volume is kept constant.
# smoothing_iterations = 1
